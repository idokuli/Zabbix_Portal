# =============================================================================
# SonarQube project configuration.
# Consumed by `sonar-scanner` in the sonarqube:scan CI job
# (.gitlab/ci/sonarqube.yml). See that job for the server URL / token.
# =============================================================================

sonar.projectKey=zabbix-portal
sonar.projectName=Zabbix Portal (Overwatch)

# Both apps live under one project so the quality gate tracks the whole
# monorepo; each app keeps its own module name so issues stay grouped in the UI.
sonar.modules=backend,frontend

backend.sonar.projectName=Backend
backend.sonar.projectBaseDir=apps/backend
backend.sonar.sources=.
backend.sonar.exclusions=.venv/**,tests/**,**/__pycache__/**
backend.sonar.tests=tests
backend.sonar.python.version=3.12
backend.sonar.python.coverage.reportPaths=coverage.xml

frontend.sonar.projectName=Frontend
frontend.sonar.projectBaseDir=apps/frontend
frontend.sonar.sources=src
frontend.sonar.exclusions=node_modules/**,.next/**,src/__tests__/__mocks__/**
frontend.sonar.tests=src
frontend.sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
frontend.sonar.javascript.lcov.reportPaths=coverage/lcov.info
