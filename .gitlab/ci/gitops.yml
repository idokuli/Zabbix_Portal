---
# =============================================================================
# GitOps — push image tags to the GitOps repo after each build.
# =============================================================================
# After backend/frontend images are built and pushed to Artifactory, this job
# clones the GitOps repo, updates the image tag in each environment's
# values.yaml, and commits back.  ArgoCD then syncs each environment:
#
#   staging    — ArgoCD auto-syncs (automated syncPolicy)
#   production — ArgoCD shows OutOfSync; operator triggers sync manually
#   dr         — same as production
#
# Required CI variables (set in GitLab → Settings → CI/CD → Variables):
#   GITOPS_REPO_URL    — HTTPS URL of the GitOps repo (no credentials in the URL)
#                        e.g. https://gitlab.example.com/team/zabbix-portal-gitops.git
#   GITOPS_TOKEN       — GitLab access token with write_repository scope on the GitOps repo
#                        (project access token or personal access token — must be masked + protected)
#   GIT_IMAGE          — image with git, e.g. alpine/git:latest
#   OC_IMAGE           — image with oc CLI (e.g. your-registry/openshift-client:latest)
#   STAGING_OC_TOKEN   — OpenShift service account token for staging (masked + protected)
#   STAGING_OC_SERVER  — OpenShift API server URL for staging
#   PROD_OC_TOKEN      — OpenShift service account token for production (masked + protected)
#   PROD_OC_SERVER     — OpenShift API server URL for production
#   DR_OC_TOKEN        — OpenShift service account token for DR (masked + protected)
#   DR_OC_SERVER       — OpenShift API server URL for DR
# =============================================================================

# ── YAML lint — validates all pipeline and compose YAML files ─────────────────
yamllint:
  extends: .base
  image:
    name: $PYTHON_IMAGE
    entrypoint: [""]
  stage: lint
  script:
    - pip install yamllint --quiet
    - yamllint -c .yamllint.yaml .gitlab-ci.yml .gitlab/ci/ docker-compose.yml
    - echo "── yamllint passed."
  rules:
    - if: $CI_COMMIT_TAG
    - if: $FORCE_BUILD == "1"

# ── Helm lint (charts now live in the GitOps repo — lint is a separate step there)
# Kept here as a lightweight sanity check if HELM_CHANGED is set and HELM_IMAGE
# is available in the app pipeline.
helm:lint:
  extends: .base
  image:
    name: $HELM_IMAGE
    entrypoint: [""]
  stage: lint

  needs:
    - job: detect
      artifacts: true
    - job: validate:variables
      artifacts: false
  script:
    - |
      [ "$HELM_CHANGED" = "1" ] || { echo "Helm charts unchanged (they live in the GitOps repo) — skipping."; exit 0; }
      echo "Note: Helm charts live in the GitOps repo. This job is a no-op unless"
      echo "you add chart linting to the GitOps repo's own pipeline."
  rules:
    - if: $CI_COMMIT_TAG
    - if: $FORCE_BUILD == "1"

# =============================================================================
# push-image-tags — update environments/<env>/values.yaml in GitOps repo
# =============================================================================
push-image-tags:
  extends: .base
  image:
    name: $GIT_IMAGE
    entrypoint: [""]
  stage: promote
  needs:
    - job: detect
      artifacts: true
    - job: validate:variables
      artifacts: false
    - job: backend:docker:build
      optional: true
      artifacts: false
    - job: frontend:docker:build
      optional: true
      artifacts: false
  script:
    - |
      set -e

      _ts()  { date '+%d/%m/%Y %H:%M:%S'; }
      log()  { echo "[$(_ts)] $*"; }
      ok()   { echo "[$(_ts)] OK  $*"; }
      fail() { echo "[$(_ts)] ERR $*" >&2; exit 1; }

      # ── Skip if nothing changed ──────────────────────────────────────────
      if [ -z "$CHANGED_APPS" ]; then
        log "No apps changed — no image tags to update."
        exit 0
      fi

      IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      [ -n "$IMAGE_TAG" ] || fail "Cannot determine image tag — CI_COMMIT_TAG and CI_COMMIT_SHORT_SHA are both empty."

      log "Image tag    : $IMAGE_TAG"
      log "Changed apps : $CHANGED_APPS"

      # ── Clone GitOps repo (HTTPS + token auth) ───────────────────────────
      REPO_HOST="$(printf '%s' "$GITOPS_REPO_URL" | sed 's|https://||')"
      git clone "https://gitlab-ci-token:${GITOPS_TOKEN}@${REPO_HOST}" gitops-repo
      cd gitops-repo

      git config user.email "ci@gitlab"
      git config user.name  "GitLab CI"

      # ── Update image tags in all environment values files ─────────────────
      # Targets only the line for the specific app using "# MANAGED BY CI:<app>"
      # so that an unchanged app's tag is never overwritten.
      update_tag() {
        local file="$1"
        local app="$2"
        local tag="$3"

        if [ ! -f "$file" ]; then
          log "  $file not found — skipping."
          return
        fi

        if ! grep -q "# MANAGED BY CI:${app}" "$file"; then
          fail "No '# MANAGED BY CI:${app}' marker found in ${file} — cannot update tag."
        fi

        sed -i "s|tag: \"[^\"]*\"   # MANAGED BY CI:${app}|tag: \"${tag}\"   # MANAGED BY CI:${app}|g" "$file"

        if ! grep -q "tag: \"${tag}\"   # MANAGED BY CI:${app}" "$file"; then
          fail "Failed to update ${app} tag in ${file} — the marker line doesn't match the expected format 'tag: \"...\"   # MANAGED BY CI:${app}' (exactly 3 spaces before '#', no space after the colon). Actual line: $(grep "MANAGED BY CI:${app}" "$file")"
        fi

        log "  Updated ${app} tag → ${tag} in ${file}"
      }

      for APP_NAME in $(echo "$CHANGED_APPS" | tr ',' ' '); do
        for ENV in staging production dr; do
          update_tag "helm-charts/overwatch/values-${ENV}.yaml" "$APP_NAME" "$IMAGE_TAG"
        done
      done

      # ── Commit and push ───────────────────────────────────────────────────
      git add helm-charts/

      if git diff --cached --quiet; then
        log "No changes to commit (tags were already up to date)."
        exit 0
      fi

      git commit -m "chore: update image tags to $IMAGE_TAG [$CHANGED_APPS]

      Source pipeline: $CI_PIPELINE_URL
      Commit:          $CI_COMMIT_SHORT_SHA
      Tag:             $IMAGE_TAG
      Changed:         $CHANGED_APPS"

      git push origin main
      ok "Image tags pushed to GitOps repo. ArgoCD will sync staging automatically."
      ok "Trigger a manual sync in ArgoCD for production and DR when ready."

  rules:
    - if: $CI_COMMIT_TAG
    - if: $FORCE_BUILD == "1"

# =============================================================================
# argocd:bootstrap — create/update ArgoCD Application via the ArgoCD CLI.
# Runs after push-image-tags on every tag push. Safe to re-run — --upsert is
# idempotent. On first run this creates the Application in ArgoCD; on subsequent
# runs it updates it if the manifest changed.
#
# staging    — runs automatically
# production — manual gate
# dr         — manual gate
#
# Required CI variables (masked + protected in GitLab Settings → CI/CD):
#   STAGING_ARGOCD_TOKEN / PROD_ARGOCD_TOKEN / DR_ARGOCD_TOKEN
#   GITOPS_TOKEN
# =============================================================================

.bootstrap_script: &bootstrap_script
  - |
    set -e

    _ts()  { date '+%d/%m/%Y %H:%M:%S'; }
    log()  { echo "[$(_ts)] $*"; }
    ok()   { echo "[$(_ts)] OK  $*"; }

    # ── Clone GitOps repo to get the Application manifests ───────────────
    REPO_HOST="$(printf '%s' "$GITOPS_REPO_URL" | sed 's|https://||')"
    git clone --depth 1 "https://gitlab-ci-token:${GITOPS_TOKEN}@${REPO_HOST}" gitops-repo

    # ── Convert YAML manifest to JSON using yq ───────────────────────────
    MANIFEST_FILE="$(mktemp /tmp/argocd-manifest.XXXXXX.json)"
    log "Converting $APP_MANIFEST to JSON..."
    yq e -o json 'del(.metadata.namespace) | del(.metadata.resourceVersion)' "gitops-repo/argocd/$APP_MANIFEST" > "$MANIFEST_FILE"
    log "Manifest file size: $(wc -c < "$MANIFEST_FILE") bytes"
    log "Manifest JSON:"
    cat "$MANIFEST_FILE"
    [ -s "$MANIFEST_FILE" ] || { echo "ERROR: manifest JSON is empty — yq conversion failed"; exit 1; }

    APP_NAME="$(yq e '.metadata.name' "gitops-repo/argocd/$APP_MANIFEST")"

    # ── Upsert the ArgoCD Application via REST API ───────────────────────
    echo "ARGOCD_TOKEN set: $([ -n "$ARGOCD_TOKEN" ] && echo YES || echo 'NO — will 401')"
    echo "ARGOCD_SERVER: $ARGOCD_SERVER"

    RESPONSE_FILE="$(mktemp)"
    HTTP_CODE="$(curl -sk -o "$RESPONSE_FILE" -w '%{http_code}' \
      -X POST "https://${ARGOCD_SERVER}/api/v1/applications?upsert=true" \
      -H "Authorization: Bearer ${ARGOCD_TOKEN}" \
      -H "Content-Type: application/json" \
      -d "@${MANIFEST_FILE}")"

    if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
      ok "ArgoCD Application applied (HTTP $HTTP_CODE). App should now appear in ArgoCD."
      if [ "$AUTO_SYNC" = "true" ]; then
        ok "This environment auto-syncs — no further action needed."
      else
        echo ""
        echo "⚠️  REMINDER: this environment does NOT auto-sync."
        echo "   The upsert above only applied the Application definition — it did not deploy anything."
        echo "   Review the diff in ArgoCD, then sync it yourself:"
        echo "     argocd app sync ${APP_NAME}"
        echo "   ...or click Sync on '${APP_NAME}' in the ArgoCD UI."
      fi
    else
      echo "ERROR: ArgoCD API returned HTTP $HTTP_CODE"
      echo "Response: $(cat "$RESPONSE_FILE")"
      exit 1
    fi

.bootstrap_base:
  extends: .base
  tags:
    - $SHARED_RUNNERS_TAG
  image:
    name: $GIT_IMAGE   # needs git + yq + curl
    entrypoint: [""]
  stage: bootstrap
  needs:
    - job: push-image-tags
      artifacts: false

argocd:bootstrap:staging:
  extends: .bootstrap_base
  variables:
    ARGOCD_SERVER: $STAGING_ARGOCD_SERVER
    APP_MANIFEST: application-staging.yaml
    ARGOCD_TOKEN: $STAGING_ARGOCD_TOKEN
    AUTO_SYNC: "true"
  script:
    - *bootstrap_script
  rules:
    - if: $CI_COMMIT_TAG
    - if: $FORCE_BUILD == "1"

argocd:bootstrap:production:
  extends: .bootstrap_base
  variables:
    ARGOCD_SERVER: $PROD_ARGOCD_SERVER
    APP_MANIFEST: application-production.yaml
    ARGOCD_TOKEN: $PROD_ARGOCD_TOKEN
    AUTO_SYNC: "false"
  script:
    - *bootstrap_script
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $FORCE_BUILD == "1"
      when: manual

argocd:bootstrap:dr:
  extends: .bootstrap_base
  variables:
    ARGOCD_SERVER: $DR_ARGOCD_SERVER
    APP_MANIFEST: application-dr.yaml
    ARGOCD_TOKEN: $DR_ARGOCD_TOKEN
    AUTO_SYNC: "false"
  script:
    - *bootstrap_script
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $FORCE_BUILD == "1"
      when: manual
