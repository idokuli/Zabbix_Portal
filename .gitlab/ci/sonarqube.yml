---
# =============================================================================
# SonarQube — static analysis + quality gate for the whole monorepo.
# =============================================================================
# Runs a single scan covering both apps/backend and apps/frontend (project
# config lives in sonar-project.properties at the repo root), rather than a
# per-app scan, so the quality-gate history in SonarQube stays continuous
# across releases regardless of which app changed.
#
# Required CI variables (set in GitLab Settings → CI/CD → Variables):
#   SONAR_TOKEN   — SonarQube analysis token (masked + protected).
#                   Generate in SonarQube: My Account → Security → Generate Token.
# Already defined as top-level pipeline variables (edit in .gitlab-ci.yml):
#   SONAR_HOST_URL      — SonarQube server URL (e.g. http://158.178.131.158:9000)
#   SONAR_SCANNER_IMAGE — sonar-scanner CLI image (PRIVATE NETWORK placeholder)
#
# Pulls in coverage.xml (backend:test) and lcov.info (frontend:test) so
# coverage shows up in the quality gate alongside bugs/smells/duplication.
# =============================================================================

sonarqube:scan:
  extends: .base
  image:
    name: $SONAR_SCANNER_IMAGE # PRIVATE NETWORK: e.g. your-registry/sonar-scanner-cli:latest
    entrypoint: [""]
  stage: lint
  allow_failure: true # non-blocking for now, same as the other lint/typecheck jobs — flip to false once the gate is tuned
  needs:
    - job: detect
      artifacts: true
    - job: validate:variables
      artifacts: false
    - job: backend:test
      optional: true
    - job: frontend:test
      optional: true
  script:
    - |
      echo "[$(date '+%H:%M:%S')] Running SonarQube analysis against $SONAR_HOST_URL ..."
      sonar-scanner \
        -Dsonar.host.url="$SONAR_HOST_URL" \
        -Dsonar.token="$SONAR_TOKEN" \
        -Dsonar.qualitygate.wait=true
      echo "[$(date '+%H:%M:%S')] Quality gate passed."
  rules:
    - if: $CI_COMMIT_TAG
    - if: $FORCE_BUILD == "1" # allow manual force-build from any branch
