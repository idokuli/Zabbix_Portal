---
# =============================================================================
# Change detection — runs once per pipeline, in the .pre stage.
# =============================================================================
# Auto-discovers every directory under apps/ and emits one dotenv variable per
# app: <APPNAME_UPPER>_CHANGED=1 when that app has changed files.
# Also emits CHANGED_APPS as a comma-separated list for downstream jobs.
#
# On a tag push:  diffs changed files between the previous tag and this one.
# With FORCE_APPS: overrides detection — builds only the listed apps (or "all").
#
# Outputs (consumed by python.yml, node.yml, gitops.yml):
#   BACKEND_CHANGED   = "1" if apps/backend/ changed (or forced)
#   FRONTEND_CHANGED  = "1" if apps/frontend/ changed (or forced)
#   CHANGED_APPS      = comma-separated list of changed app names (e.g. "backend,frontend")
#   PREV_TAG          = the tag we diffed against (empty on first-ever release)
#
# Adding a new app: create apps/<newapp>/ — detect picks it up automatically.
# =============================================================================

detect:
  extends: .base
  image: $GIT_IMAGE
  stage: .pre
  variables:
    GIT_DEPTH: 0   # full history needed to find ancestor tags
  script:
    - |
      set -e

      PREV_TAG=""
      if [ -n "$CI_COMMIT_TAG" ]; then
        PREV_TAG=$(git describe --tags --abbrev=0 "${CI_COMMIT_TAG}^" 2>/dev/null || echo "")
      fi

      echo "── Detection parameters ──────────────────────────────"
      echo "Current tag : ${CI_COMMIT_TAG:-<branch run>}"
      echo "Previous tag: ${PREV_TAG:-<none>}"
      echo "FORCE_APPS  : ${FORCE_APPS:-<none — using file diff>}"
      echo "──────────────────────────────────────────────────────"

      # Returns 0 (true) if the app name is in FORCE_APPS or FORCE_APPS=all
      is_forced() {
        [ -z "$FORCE_APPS" ] && return 1
        [ "$FORCE_APPS" = "all" ] && return 0
        echo ",$FORCE_APPS," | grep -q ",${1},"
      }

      > detect.env
      CHANGED_APPS=""

      echo "── Per-app results ───────────────────────────────────"

      for APP_DIR in apps/*/; do
        [ -d "$APP_DIR" ] || continue
        APP_NAME=$(basename "$APP_DIR")
        APP_KEY=$(echo "$APP_NAME" | tr '[:lower:]-' '[:upper:]_')
        CHANGED=0
        REASON=""

        if is_forced "$APP_NAME"; then
          CHANGED=1
          REASON="forced via FORCE_APPS"
        elif [ -n "$CI_COMMIT_TAG" ] && [ -z "$PREV_TAG" ]; then
          CHANGED=1
          REASON="first tag — no previous release to diff against"
        elif [ -n "$CI_COMMIT_TAG" ] && [ -n "$PREV_TAG" ]; then
          if git diff --name-only "$PREV_TAG" "$CI_COMMIT_TAG" | grep -q "^${APP_DIR}"; then
            CHANGED=1
            REASON="files changed since $PREV_TAG"
          else
            # Extra check: root JS config files rebuild the frontend
            if [ "$APP_NAME" = "frontend" ]; then
              if git diff --name-only "$PREV_TAG" "$CI_COMMIT_TAG" | \
                 grep -qE "^(package\.json|package-lock\.json|biome\.json|\.npmrc)$"; then
                CHANGED=1
                REASON="root JS config changed since $PREV_TAG"
              fi
            fi
            [ "$CHANGED" = "0" ] && REASON="unchanged since $PREV_TAG"
          fi
        fi

        echo "  $APP_NAME: ${APP_KEY}_CHANGED=$CHANGED  ($REASON)"
        echo "${APP_KEY}_CHANGED=$CHANGED" >> detect.env
        [ "$CHANGED" = "1" ] && CHANGED_APPS="${CHANGED_APPS:+$CHANGED_APPS,}$APP_NAME"
      done

      echo "PREV_TAG=$PREV_TAG" >> detect.env
      echo "CHANGED_APPS=$CHANGED_APPS" >> detect.env

      echo "──────────────────────────────────────────────────────"
      echo "── detect.env ────────────────────────────────────────"
      cat detect.env
      echo "──────────────────────────────────────────────────────"
  artifacts:
    reports:
      dotenv: detect.env
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_TAG
    - if: $FORCE_APPS  # non-empty: manual force from any branch

# ── Variable validation ───────────────────────────────────────────────────────
# Prints all pipeline variables at the start of every run so you can verify
# their values in the job log. Sensitive variables (tokens, passwords) are
# only checked for presence — their values are never printed.
validate:variables:
  extends: .base
  stage: .pre
  image:
    name: $GIT_IMAGE  # pinned — PRIVATE NETWORK: replace with your internal alpine image
    entrypoint: [""]
  script:
    - |
      echo "══════════════════════════════════════════════════════"
      echo "  Pipeline variable validation"
      echo "══════════════════════════════════════════════════════"

      echo ""
      echo "── Project ───────────────────────────────────────────"
      echo "  PROJECT_NAME         = $PROJECT_NAME"
      echo "  CI_COMMIT_TAG        = $CI_COMMIT_TAG"
      echo "  FORCE_APPS           = ${FORCE_APPS:-<empty — auto-detect>}"
      echo "  SHARED_RUNNERS_TAG   = $SHARED_RUNNERS_TAG"

      echo ""
      echo "── Registry ──────────────────────────────────────────"
      echo "  ARTIFACTORY_REGISTRY = $ARTIFACTORY_REGISTRY"

      echo ""
      echo "── Images ────────────────────────────────────────────"
      echo "  KANIKO_IMAGE         = $KANIKO_IMAGE"
      echo "  PYTHON_IMAGE         = $PYTHON_IMAGE"
      echo "  NODE_IMAGE           = $NODE_IMAGE"
      echo "  GIT_IMAGE            = $GIT_IMAGE"

      echo ""
      echo "── GitOps repo ───────────────────────────────────────"
      echo "  GITOPS_REPO_URL      = $GITOPS_REPO_URL"
      echo "  GITOPS_TOKEN         = $([ -n "$GITOPS_TOKEN" ] && echo '*** (set)' || echo '!!! NOT SET')"

      echo ""
      echo "── ArgoCD servers ────────────────────────────────────"
      echo "  STAGING_ARGOCD_SERVER    = $STAGING_ARGOCD_SERVER"
      echo "  STAGING_ARGOCD_TOKEN     = $([ -n "$STAGING_ARGOCD_TOKEN" ] && echo '*** (set)' || echo '!!! NOT SET')"
      echo "  PROD_ARGOCD_SERVER       = $PROD_ARGOCD_SERVER"
      echo "  PROD_ARGOCD_TOKEN        = $([ -n "$PROD_ARGOCD_TOKEN" ] && echo '*** (set)' || echo '!!! NOT SET')"
      echo "  DR_ARGOCD_SERVER         = $DR_ARGOCD_SERVER"
      echo "  DR_ARGOCD_TOKEN          = $([ -n "$DR_ARGOCD_TOKEN" ] && echo '*** (set)' || echo '!!! NOT SET')"

      echo ""
      echo "══════════════════════════════════════════════════════"

      # Hard-fail if any critical variable is missing.
      MISSING=0
      REQUIRED_VARS="SHARED_RUNNERS_TAG"
      REQUIRED_VARS="$REQUIRED_VARS KANIKO_IMAGE PYTHON_IMAGE NODE_IMAGE GIT_IMAGE"
      REQUIRED_VARS="$REQUIRED_VARS ARTIFACTORY_REGISTRY PROJECT_NAME GITOPS_REPO_URL GITOPS_TOKEN"
      REQUIRED_VARS="$REQUIRED_VARS STAGING_ARGOCD_SERVER PROD_ARGOCD_SERVER DR_ARGOCD_SERVER"
      # tokens (STAGING/PROD/DR_ARGOCD_TOKEN) are masked — not checkable here
      for VAR in $REQUIRED_VARS; do
        eval "VAL=\${$VAR:-}"
        if [ -z "$VAL" ]; then
          echo "ERROR: required CI variable '$VAR' is not set."
          MISSING=1
        fi
      done
      [ "$MISSING" = "0" ] || exit 1
  rules:
    - if: $CI_COMMIT_TAG
    - if: $FORCE_APPS
