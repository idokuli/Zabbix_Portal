---
# =============================================================================
# Change detection — runs once per pipeline, in the .pre stage.
# =============================================================================
# Determines which apps changed BETWEEN THE PREVIOUS TAG AND THIS ONE so that
# only the modified apps are rebuilt and re-deployed.
#
# This pipeline runs only on tag pushes (see common.yml .rules_release), so
# the comparison base is always the most recent ancestor tag — never HEAD~1
# or a branch SHA.
#
# Outputs (consumed by python.yml, node.yml, gitops.yml):
#   BACKEND_CHANGED   = "1" if anything under apps/backend/ changed
#   FRONTEND_CHANGED  = "1" if anything under apps/frontend/ or root JS config changed
#   PREV_TAG          = the tag we diffed against (empty on first-ever release)
#
# Note: HELM_CHANGED is no longer emitted — Helm charts now live in the
# separate GitOps repo (zabbix-portal-gitops) and are managed there.
# =============================================================================

detect:
  extends: .base
  image: $GIT_IMAGE  # pinned — mutable :latest breaks reproducibility
  stage: .pre
  variables:
    GIT_DEPTH: 0   # full history needed to find ancestor tags
  script:
    - |
      set -e

      # The most recent annotated/lightweight tag that is an ancestor of this
      # one — i.e. the previous release. May be empty on the first tag ever.
      PREV_TAG=$(git describe --tags --abbrev=0 "${CI_COMMIT_TAG}^" 2>/dev/null || echo "")

      echo "── Tag diff base ─────────────────────────────────────"
      echo "Current tag : $CI_COMMIT_TAG"
      echo "Previous tag: ${PREV_TAG:-<none>}"
      echo "──────────────────────────────────────────────────────"

      BACKEND_CHANGED=0
      FRONTEND_CHANGED=0

      if [ -n "$CI_COMMIT_TAG" ]; then
        # Tag push = release: always build and deploy both apps.
        echo "→ Tag push: marking all apps as changed."
        BACKEND_CHANGED=1
        FRONTEND_CHANGED=1
      elif [ -n "$FORCE_BUILD" ] && [ "$FORCE_BUILD" != "0" ]; then
        echo "→ FORCE_BUILD=1: marking all apps as changed."
        BACKEND_CHANGED=1
        FRONTEND_CHANGED=1
      fi

      {
        echo "BACKEND_CHANGED=$BACKEND_CHANGED"
        echo "FRONTEND_CHANGED=$FRONTEND_CHANGED"
        echo "PREV_TAG=$PREV_TAG"
      } > detect.env

      echo "── Detection result ──────────────────────────────────"
      cat detect.env
      echo "──────────────────────────────────────────────────────"
  artifacts:
    reports:
      dotenv: detect.env
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_TAG
    - if: $FORCE_BUILD == "1"  # allow manual force-deploy from any branch

# ── Variable validation ───────────────────────────────────────────────────────
# Prints all pipeline variables at the start of every run so you can verify
# their values in the job log. Sensitive variables (tokens, passwords) are
# only checked for presence — their values are never printed.
validate:variables:
  extends: .base
  stage: .pre
  image:
    name: $GIT_IMAGE  # pinned — PRIVATE NETWORK: replace with your internal alpine image
    entrypoint: [""]
  script:
    - |
      echo "══════════════════════════════════════════════════════"
      echo "  Pipeline variable validation"
      echo "══════════════════════════════════════════════════════"

      echo ""
      echo "── Project ───────────────────────────────────────────"
      echo "  PROJECT_NAME         = $PROJECT_NAME"
      echo "  CI_COMMIT_TAG        = $CI_COMMIT_TAG"
      echo "  FORCE_BUILD          = $FORCE_BUILD"
      echo "  SHARED_RUNNERS_TAG   = $SHARED_RUNNERS_TAG"

      echo ""
      echo "── Registry ──────────────────────────────────────────"
      echo "  ARTIFACTORY_REGISTRY = $ARTIFACTORY_REGISTRY"

      echo ""
      echo "── Images ────────────────────────────────────────────"
      echo "  KANIKO_IMAGE         = $KANIKO_IMAGE"
      echo "  PYTHON_IMAGE         = $PYTHON_IMAGE"
      echo "  NODE_IMAGE           = $NODE_IMAGE"
      echo "  GIT_IMAGE            = $GIT_IMAGE"

      echo ""
      echo "── GitOps repo ───────────────────────────────────────"
      echo "  GITOPS_REPO_URL      = $GITOPS_REPO_URL"
      echo "  GITOPS_TOKEN         = $([ -n "$GITOPS_TOKEN" ] && echo '*** (set)' || echo '!!! NOT SET')"

      echo ""
      echo "── ArgoCD servers ────────────────────────────────────"
      echo "  STAGING_ARGOCD_SERVER    = $STAGING_ARGOCD_SERVER"
      echo "  STAGING_ARGOCD_TOKEN     = $([ -n "$STAGING_ARGOCD_TOKEN" ] && echo '*** (set)' || echo '!!! NOT SET')"
      echo "  PROD_ARGOCD_SERVER       = $PROD_ARGOCD_SERVER"
      echo "  PROD_ARGOCD_TOKEN        = $([ -n "$PROD_ARGOCD_TOKEN" ] && echo '*** (set)' || echo '!!! NOT SET')"
      echo "  DR_ARGOCD_SERVER         = $DR_ARGOCD_SERVER"
      echo "  DR_ARGOCD_TOKEN          = $([ -n "$DR_ARGOCD_TOKEN" ] && echo '*** (set)' || echo '!!! NOT SET')"

      echo ""
      echo "══════════════════════════════════════════════════════"

      # Hard-fail if any critical variable is missing.
      MISSING=0
      REQUIRED_VARS="SHARED_RUNNERS_TAG"
      REQUIRED_VARS="$REQUIRED_VARS KANIKO_IMAGE PYTHON_IMAGE NODE_IMAGE GIT_IMAGE"
      REQUIRED_VARS="$REQUIRED_VARS ARTIFACTORY_REGISTRY PROJECT_NAME GITOPS_REPO_URL GITOPS_TOKEN"
      REQUIRED_VARS="$REQUIRED_VARS STAGING_ARGOCD_SERVER PROD_ARGOCD_SERVER DR_ARGOCD_SERVER"
      # tokens (STAGING/PROD/DR_ARGOCD_TOKEN) are masked — not checkable here
      for VAR in $REQUIRED_VARS; do
        eval "VAL=\${$VAR:-}"
        if [ -z "$VAL" ]; then
          echo "ERROR: required CI variable '$VAR' is not set."
          MISSING=1
        fi
      done
      [ "$MISSING" = "0" ] || exit 1
  rules:
    - if: $CI_COMMIT_TAG
